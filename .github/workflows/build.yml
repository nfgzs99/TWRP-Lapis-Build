name: Build TWRP for Lapis
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses6 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

      - name: Download TWRP Source
        run: |
          # 下载 repo 工具并赋予权限
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=$PATH:~/bin

          # 开始拉取源码
          mkdir twrp && cd twrp
          git config --global user.name "runner"
          git config --global user.email "runner@github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j$(nproc) --force-sync

      - name: Build TWRP
        run: |
          cd twrp
          mkdir -p device/xiaomi/lapis/prebuilt
          
          # 使用 find 命令复制，彻底避开 twrp 源码目录和 .git 隐藏文件夹，防止死循环
          find $GITHUB_WORKSPACE -mindepth 1 -maxdepth 1 ! -name "twrp" ! -name ".git" -exec cp -r {} device/xiaomi/lapis/ \;
          
          # 强行确保官方内核和DTB已在正确位置
          cp $GITHUB_WORKSPACE/prebuilt/kernel device/xiaomi/lapis/prebuilt/kernel
          cp $GITHUB_WORKSPACE/prebuilt/dtb.img device/xiaomi/lapis/prebuilt/dtb.img
          
          # 加载编译环境
          source build/envsetup.sh
          lunch twrp_lapis-eng
          mka bootimage -j$(nproc)

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Boot-Image
          path: twrp/out/target/product/lapis/boot.img
